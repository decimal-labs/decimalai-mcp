name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    # Permissions are declared per job, never workflow-wide: a workflow-level
    # `id-token: write` is inherited by EVERY job, and this one runs
    # `pip install -e ".[dev]"` — arbitrary install-time and import-time code from
    # every transitive dev dependency. That code must not be able to mint a PyPI
    # Trusted-Publisher token. Only the publish job below gets id-token.
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest tests/ -v

  publish:
    name: Publish to PyPI
    needs: test  # Only publish if tests pass
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # Required for Trusted Publisher (OIDC). Scoped to this job only.
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build

      - name: Build package
        run: python -m build

      - name: Verify package version matches release tag
        run: |
          PKG_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "❌ Version mismatch: pyproject.toml=$PKG_VERSION, tag=$TAG_VERSION"
            exit 1
          fi
          echo "✅ Version match: $PKG_VERSION"

      # The MCP registry verifies PyPI ownership by finding `mcp-name: <server>`
      # in the PUBLISHED README. PyPI is append-only, so a missing or mismatched
      # marker cannot be fixed in place — it costs a whole version. Fail first.
      - name: Verify the mcp-name marker matches server.json
        run: |
          NAME=$(python -c "import json; print(json.load(open('server.json'))['name'])")
          grep -q "mcp-name: ${NAME}" README.md || {
            echo "❌ README.md is missing 'mcp-name: ${NAME}' — the MCP registry will reject the listing"; exit 1; }
          echo "✅ mcp-name marker present: ${NAME}"

      - name: Publish to PyPI
        # SHA-pinned (not a mutable tag): this job holds OIDC id-token:write →
        # PyPI publish authority. Same pin as decimalai-python.
        # v1.14.2. Pinned by SHA, not a mutable tag: this job holds OIDC
        # id-token:write, i.e. PyPI publish authority.
        # Must stay >= v1.14.2 while the build backend is unpinned. hatchling now
        # emits `Metadata-Version: 2.5`, and the twine bundled in v1.14.0 rejects it
        # with `InvalidDistribution: '2.5' is not a valid metadata version` — at the
        # pre-upload check, so it fails BEFORE Trusted Publishing is even attempted.
        # v1.14.2 ships Twine 7, which accepts 2.5.
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # release/v1
        # No API token needed — uses Trusted Publisher (OIDC)
