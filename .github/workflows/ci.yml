name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Matches requires-python = ">=3.10".
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest tests/ -v

      # The `mcp<2` cap is load-bearing: mcp 2.0.0 removed `mcp.server.fastmcp`
      # entirely, so a widened cap breaks the server at IMPORT time — which unit
      # tests that mock the transport would not necessarily catch. Assert the
      # resolved dependency still provides the interface server.py is written against.
      - name: Assert the pinned mcp still provides FastMCP
        run: |
          python - <<'PY'
          from mcp.server.fastmcp import FastMCP   # noqa: F401
          import decimalai_mcp.server               # noqa: F401
          import importlib.metadata as md
          print("OK — mcp", md.version("mcp"), "provides FastMCP; server imports clean")
          PY
